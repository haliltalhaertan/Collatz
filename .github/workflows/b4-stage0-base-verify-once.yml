name: B4 Stage0 canonical handoff verify once
on:
  push:
    branches:
      - cp20-e7r-b4-tilted-microcanonical-fourier-v1-stage0-20260904
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify canonical handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "57f670bd531cee8f0f2d6eeb27431243f6e3a479"
          python tools/verify_handoff.py | tee /tmp/handoff.txt
          grep -F "HANDOFF VERIFICATION: PASS" /tmp/handoff.txt
