name: E7R literature Stage1 persist once

on:
  push:
    branches:
      - cp20-e7r-literature-transfer-v1-stage1-audit-stop-20260904

permissions:
  contents: write

jobs:
  persist:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist sealed Stage1 audit-stop artifacts only
        shell: bash
        run: |
          set -euo pipefail
          DEST='research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP'
          TMP="$RUNNER_TEMP/e7r_lt_stage1_payload.tar.gz"
          cat > "$RUNNER_TEMP/payload.b64" <<'B64'

B64
          base64 -d "$RUNNER_TEMP/payload.b64" > "$TMP"
          test "$(sha256sum "$TMP" | awk '{print $1}')" = '9591f63b448d52299ae086e44b2402959ded341f41019dd14b85dabe40ea944a'
          mkdir -p "$DEST"
          tar -xzf "$TMP" -C "$DEST" --strip-components=1
          test -f "$DEST/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_RESULT.json"
          test -f "$DEST/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_REPORT.md"
          rm -f .github/workflows/e7r-literature-stage1-persist-once.yml
          git config user.name 'Canonical Stage1 Persistence'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" .github/workflows/e7r-literature-stage1-persist-once.yml
          git commit -m '[skip ci] Persist Literature Transfer V1 Stage1 LT-CT audit stop'
          git push origin HEAD:cp20-e7r-literature-transfer-v1-stage1-audit-stop-20260904
