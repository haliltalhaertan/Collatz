name: B4 V2 Stage1 Integrity Once

on:
  push:
    branches:
      - cp20-e7r-b4-v2-stage1-20260905
    paths:
      - .github/workflows/b4v2-stage1-once.yml

permissions:
  contents: write

jobs:
  stage1-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical handoff on exact main
        shell: bash
        run: |
          set -euo pipefail
          RESULT_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "1a6f924fd86352c11f57a95b0382adaf92d15bcd"
          git switch -C main origin/main
          python tools/verify_handoff.py | tee /tmp/b4v2_handoff.txt
          grep -F "HANDOFF VERIFICATION: PASS" /tmp/b4v2_handoff.txt
          test "$(git rev-parse HEAD)" = "1a6f924fd86352c11f57a95b0382adaf92d15bcd"
          git switch "$RESULT_BRANCH"

      - name: Reconstruct and verify exact authorized seal
        shell: bash
        run: |
          set -euo pipefail
          check_part() {
            local f="$1" expected="$2"
            local got bytes
            got="$(tr -d '\r\n\t ' < "$f" | sha256sum | awk '{print $1}')"
            bytes="$(tr -d '\r\n\t ' < "$f" | wc -c)"
            echo "$(basename "$f") norm_bytes=${bytes} sha256=${got}"
            test "$got" = "$expected"
          }
          check_part .stage1_b4v2/seal.part00 d1930c60b44ffe4964fa4f09fe00505fb46ddab9d5e0254b89eaf08406ebbfc7
          check_part .stage1_b4v2/seal.part01 1905ed388e1d9b7e655e3c0ca7def20072675c9e5dc2c8b74965e9bb7550fc70
          check_part .stage1_b4v2/seal.part02 ed1b828547568a58bdd36654c1f5ea11219a318cb98dc29e2280913597f60597
          check_part .stage1_b4v2/seal.part03 0e8ae0517a0c5d0f013eda3705aa77f967ae423b2e996fc08d7afdbff62742b9
          check_part .stage1_b4v2/seal.part04a 4be8a16f7ce30fc45ccc77b22b01d867df1b0bd729cf61931187c41d0e7e8ebb
          check_part .stage1_b4v2/seal.part04b e9a9c6e79c0ecc061fa0d6da4ebad0f7cdbd722665cbef0a30d4b7ef4244b377
          check_part .stage1_b4v2/seal.part04c 6f8e33b6688221e1a2fe5eec0e147656d3b33be34762b0f4de8d90309275c741
          check_part .stage1_b4v2/seal.part04d 1cdb867226b4bb84239d9d0836fd4e215e378c44244c63086dc9ed0a98b7aaf6
          check_part .stage1_b4v2/seal.part05 64dea11ddd5972e57db62b9965bb210f72fcb9381adf6986349cea1f65140db1
          check_part .stage1_b4v2/seal.part06 20dc2f92995a7115b15f11660245e8240099986a0dc7ad50cccd186eaa0d695d
          check_part .stage1_b4v2/seal.part07 2a23c5040fa9bb92f2b00299c0d1b8510c546c7988b970ab303f8313f95fad4c
          cat \
            .stage1_b4v2/seal.part00 .stage1_b4v2/seal.part01 .stage1_b4v2/seal.part02 .stage1_b4v2/seal.part03 \
            .stage1_b4v2/seal.part04a .stage1_b4v2/seal.part04b .stage1_b4v2/seal.part04c .stage1_b4v2/seal.part04d \
            .stage1_b4v2/seal.part05 .stage1_b4v2/seal.part06 .stage1_b4v2/seal.part07 \
            | tr -d '\r\n\t ' | base64 -d > /tmp/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PRE_RUN_SEAL.zip
          ACTUAL="$(sha256sum /tmp/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PRE_RUN_SEAL.zip | awk '{print $1}')"
          echo "$ACTUAL" | tee /tmp/b4v2_seal_sha.txt
          test "$ACTUAL" = "11456b7d6f673e5cab6079850731cbda70373b77e4e0f532089d6783fd16c78e"
          python - <<'PY'
          import zipfile
          p='/tmp/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PRE_RUN_SEAL.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=[i.filename for i in z.infolist()]
              assert names == sorted(names)
              assert len(names) == len(set(names))
          print('SEAL ZIP MECHANICS: PASS')
          PY

      - name: Pre-invocation output absence guard
        shell: bash
        run: |
          set -euo pipefail
          D="research_manager/results/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0"
          for f in \
            "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_RUN_WITNESS.json" \
            "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_PRE_T1_GATE.json" \
            "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_EXECUTION_LEDGER.jsonl" \
            "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_INPUT_INTEGRITY_FAILURE.json" \
            "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_RESULTS.json"; do
            if [ -e "$f" ]; then
              echo "REFUSING REAL INVOCATION: pre-existing Stage1 output: $f" >&2
              exit 91
            fi
          done
          echo "OUTPUT ABSENCE PRECHECK: PASS"

      - name: Single real Stage1 integrity invocation
        id: invoke
        shell: bash
        run: |
          set -euo pipefail
          D="research_manager/results/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0"
          touch /tmp/b4v2_launcher_invoked
          python \
            "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1.py" \
            --config "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_CONFIG.json" \
            --seal /tmp/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PRE_RUN_SEAL.zip \
            --canonical-stage0-base-sha 34ac0dbeb8c0ae2fddab706680f1682412b00786 \
            --authorization-commit-sha f8d778a2113922e3bbb14c86ee2fa5359cee28ea \
            --authorized-seal-sha256 11456b7d6f673e5cab6079850731cbda70373b77e4e0f532089d6783fd16c78e \
            --contract-sha256 7f2531743db7c2987d6efa785784852bc6fe066ccc23cfc607296de96f3eb403 \
            --output "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_RESULTS.json" \
            2>&1 | tee "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_INTEGRITY_STDOUT.txt"
          grep -F "B4 V2 STAGE1 PRE-T1 INTEGRITY GATE: PASS" "$D/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_INTEGRITY_STDOUT.txt"

      - name: Collect invocation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b4v2_evidence
          cp /tmp/b4v2_handoff.txt /tmp/b4v2_evidence/ 2>/dev/null || true
          cp /tmp/b4v2_seal_sha.txt /tmp/b4v2_evidence/ 2>/dev/null || true
          D="research_manager/results/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0"
          find "$D" -maxdepth 1 -type f -name '*STAGE1*' -exec cp {} /tmp/b4v2_evidence/ \; 2>/dev/null || true

      - name: Upload invocation evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-v2-stage1-integrity-evidence
          path: /tmp/b4v2_evidence
          if-no-files-found: warn

      - name: Persist invocation evidence to result branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /tmp/b4v2_launcher_invoked ]; then
            echo "Launcher was not invoked; leaving authorization unconsumed and prep state intact."
            exit 0
          fi
          D="research_manager/results/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0"
          git config user.name "B4 V2 Stage1 Producer"
          git config user.email "actions@users.noreply.github.com"
          git add "$D"
          git rm -r .stage1_b4v2
          if git diff --cached --quiet; then
            echo "No invocation evidence to persist" >&2
            exit 92
          fi
          git commit -m "Record B4 V2 Stage1 integrity invocation evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
