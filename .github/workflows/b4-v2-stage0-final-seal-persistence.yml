name: B4 V2 Stage0 Final Seal Persistence

on:
  push:
    branches:
      - cp20-e7r-b4-v2-stage0-finalization-handoff-20260904

permissions:
  contents: write

jobs:
  persist-final-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@v4
        with:
          ref: cp20-e7r-b4-v2-stage0-finalization-handoff-20260904
          fetch-depth: 0

      - name: Build and validate deterministic final seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('research_manager/results/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0')
          task='CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2'
          manifest=root/f'{task}_PRE_RUN_SHA256SUMS.txt'
          out=root/f'{task}_PRE_RUN_SEAL.zip'
          expected_manifest='9cadd5bfa74a88350a7ba4911f18ff73cafe7bb7065f1496893e526d9a2f5604'
          expected_zip='66ac975940abb29a1248079ea6e03643ded966da296cf33deb7c7a0f5fa60eac'
          h=lambda b: hashlib.sha256(b).hexdigest()
          assert h(manifest.read_bytes()) == expected_manifest, 'final manifest SHA mismatch'
          listed=[]; mismatches=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              hh,name=line.split('  ',1)
              p=root/name
              if not p.is_file():
                  mismatches.append((name,hh,'MISSING'))
              else:
                  got=h(p.read_bytes())
                  if got != hh:
                      mismatches.append((name,hh,got))
              listed.append(name)
          if mismatches:
              print('SEALED MEMBER BYTE MISMATCHES:')
              for name,expected,got in mismatches:
                  print(f'{name}\n  expected={expected}\n  actual={got}')
              raise SystemExit(2)
          members=sorted(listed+[manifest.name])
          assert len(members)==27 and len(members)==len(set(members))
          with zipfile.ZipFile(out,'w') as z:
              for name in members:
                  p=root/name
                  info=zipfile.ZipInfo(name,(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info._compresslevel=9
                  info.create_system=0
                  info.external_attr=(0o600 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes())
          assert h(out.read_bytes()) == expected_zip, 'final ZIP SHA mismatch'
          with zipfile.ZipFile(out) as z:
              assert z.namelist()==sorted(z.namelist())
              assert len(z.namelist())==len(set(z.namelist()))==27
              assert z.testzip() is None
          print('FINAL SEAL BUILD: PASS')
          print('final_seal_sha256='+expected_zip)
          print('final_manifest_sha256='+expected_manifest)
          print('member_count=27')
          PY

      - name: Commit final binary seal if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILE='research_manager/results/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PRE_RUN_SEAL.zip'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo 'Final seal already persisted exactly; no commit needed.'
          else
            git commit -m 'B4 V2 Stage0: persist final handoff-verified seal binary'
            git push origin HEAD:cp20-e7r-b4-v2-stage0-finalization-handoff-20260904
          fi
