          import hashlib, json, os
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          R=Path('research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP')
