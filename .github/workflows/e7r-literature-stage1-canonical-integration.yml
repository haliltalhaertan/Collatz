          for text in ('[AUDIT PASS — DIRECT TAO/SI THEOREM TRANSFER CLOSED]','[EXECUTION INTEGRITY PASS WITH DOCUMENTATION GAP]','[PACKAGE INTEGRITY PASS]'):
