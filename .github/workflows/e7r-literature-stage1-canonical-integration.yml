          drive=json.loads((R/'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_DRIVE_PERSISTENCE_RECORD.json').read_text())
          assert drive['expected_package_sha256']==os.environ['STAGE1_PACKAGE']==drive['readback_package_sha256']
          assert drive['readback_byte_compare']=='PASS' and drive['readback_verdict']=='PASS'
          assert sha(A/'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_ZERO_TRUST_AUDIT_2026-09-04.md')==os.environ['AUDIT_FULL']
          rows=(A/'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_ZERO_TRUST_AUDIT_SHA256SUMS_2026-09-04.txt').read_text().splitlines()
