          ref: main
          fetch-depth: 0

      - name: Verify authoritative refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUIRED_MAIN"
          git fetch origin \
            "+refs/heads/${RESULT_BRANCH}:refs/remotes/origin/${RESULT_BRANCH}" \
            "+refs/heads/${AUDIT_BRANCH}:refs/remotes/origin/${AUDIT_BRANCH}"
          test "$(git rev-parse origin/${RESULT_BRANCH})" = "$RESULT_HEAD"
          test "$(git rev-parse origin/${AUDIT_BRANCH})" = "$AUDIT_HEAD"
          test "$(git merge-base "$REQUIRED_MAIN" "$RESULT_HEAD")" = "$REQUIRED_MAIN"
          test "$(git merge-base "$REQUIRED_MAIN" "$AUDIT_HEAD")" = "$REQUIRED_MAIN"

      - name: Acquire active integrator lock as first canonical write
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json, os
          p=Path('CURRENT_RESEARCH_STATE.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          old=s.get('active_integrator',{})
          assert old.get('status') == 'RELEASED', old
          now=datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds')
          s['active_integrator']={
            'holder':'canonical-integrator-e7r-literature-stage1-audit-20260904',
            'scope':'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1 audited Stage-1 canonical integration only; no Stage-1 rerun, no new mathematics, no weighted/operator work, no E8, and no execution of the next research task.',
            'base_commit':os.environ['REQUIRED_MAIN'],
            'acquired_at':now,
            'status':'HELD'
          }
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY
          git config user.name 'Canonical Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_RESEARCH_STATE.json
          git commit -m 'Acquire integrator lock for audited Literature Transfer V1 integration'
          LOCK_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$LOCK_SHA"
          echo "lock_sha=${LOCK_SHA}" >> "$GITHUB_OUTPUT"

      - name: Copy only budget-safe authoritative records
        shell: bash
        run: |
          set -euo pipefail
          R='research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP'
          for f in \
            CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_AUDIT_STOP.md \
            CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_DRIVE_PERSISTENCE_RECORD.json \
            CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_INDEPENDENT_FINITE_PHASE.py \
            CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_MECHANICAL_RESULTS.json \
            CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_PACKAGE_RECORD.json \
            CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_PROVENANCE.json \
