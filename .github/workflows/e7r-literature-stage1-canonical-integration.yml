    branches:
      - integration-e7r-literature-stage1-canonical-20260904

permissions:
  contents: write
  actions: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    env:
      REQUIRED_MAIN: 9119a39957705f53060c380acf3e8f4dd6609565
      RESULT_BRANCH: cp20-e7r-literature-transfer-v1-stage1-audit-stop-20260904
