name: Audited Literature Transfer V1 Canonical Integration

on:
  push:
    branches:
      - integration-e7r-literature-stage1-canonical-20260904

permissions:
  contents: write
  actions: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch authoritative refs and integration driver
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/integration-e7r-literature-stage1-canonical-20260904:refs/remotes/origin/integration-e7r-literature-stage1-canonical-20260904 \
            +refs/heads/cp20-e7r-literature-transfer-v1-stage1-audit-stop-20260904:refs/remotes/origin/cp20-e7r-literature-transfer-v1-stage1-audit-stop-20260904 \
            +refs/heads/cp20-e7r-literature-transfer-v1-zero-trust-audit-20260904:refs/remotes/origin/cp20-e7r-literature-transfer-v1-zero-trust-audit-20260904
          git show origin/integration-e7r-literature-stage1-canonical-20260904:.github/integration/e7r_literature_stage1_integrate.py > /tmp/e7r_literature_stage1_integrate.py

      - name: Canonically integrate audited Stage-1 without rerun
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/e7r_literature_stage1_integrate.py

      - name: Upload canonical persistence bundle
        uses: actions/upload-artifact@v4
        with:
          name: CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_AUDITED_CANONICAL_PERSISTENCE
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            Collatz_Research_Archive_CURRENT.zip
            CURRENT_ARCHIVE_BUILD.json
            CURRENT_RESEARCH_STATE.json
            START_HERE_CURRENT_HANDOFF.md
            research_manager/RESEARCH_JOURNAL.jsonl
            research_manager/decisions/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_AUDITED_INTEGRATION_2026-09-04.md
            research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_REPORT.md
            research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_RESULT.json
            research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_PACKAGE_RECORD.json
            research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUDIT_STOP/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_DRIVE_PERSISTENCE_RECORD.json
            bagimsiz-denetim/e7r-literature-transfer-v1-zero-trust-audit-20260904/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_ZERO_TRUST_AUDIT_2026-09-04.md
            bagimsiz-denetim/e7r-literature-transfer-v1-zero-trust-audit-20260904/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_ZERO_TRUST_AUDIT_SHA256SUMS_2026-09-04.txt
            HANDOFF_VERIFICATION.txt
            ARCHIVE_BUDGET.json
            PERSISTENCE_MANIFEST.json
            FINAL_SHA.txt
