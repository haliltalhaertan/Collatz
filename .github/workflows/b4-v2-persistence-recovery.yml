name: B4 V2 Persistence Recovery

on:
  push:
    branches:
      - b4-v2-persistence-recovery-20260905

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build canonical persistence ZIP read-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, hashlib, subprocess
          out=Path('CP20_TASK8B3_E7R_B4_V2_CANONICAL_INTAKE_STAGE1_AUTHORIZATION_PERSISTENCE.zip')
          files=[
            'CURRENT_RESEARCH_STATE.json',
            'START_HERE_CURRENT_HANDOFF.md',
            'CURRENT_ARCHIVE_BUILD.json',
            'Collatz_Research_Archive_CURRENT.zip',
            'research_manager/RESEARCH_JOURNAL.jsonl',
            'research_manager/decisions/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE0_ACCEPTANCE_AND_CANONICALIZATION_2026-09-05.json',
            'research_manager/decisions/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_STAGE1_AUTHORIZATION.json',
            'research_manager/records/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PHASE_A_READBACK_2026-09-05.json',
            'research_manager/records/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_PHASE_B_READBACK_2026-09-05.json',
            'research_manager/records/CP20_TASK8B3_E7R_B4_TILTED_MICROCANONICAL_FOURIER_V2_CANONICAL_TRANSACTION_2026-09-05.json',
          ]
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head=='1a6f924fd86352c11f57a95b0382adaf92d15bcd', head
          state=json.loads(Path('CURRENT_RESEARCH_STATE.json').read_text())
          build=json.loads(Path('CURRENT_ARCHIVE_BUILD.json').read_text())
          summary={
            'schema':'CP20_TASK8B3_E7R_B4_V2_PERSISTENCE_RECOVERY_V1',
            'final_main_sha':head,
            'phase_a_commit_sha':state['b4_v2_stage0']['canonical_stage0_base_sha'],
            'phase_b_commit_sha':state['b4_v2_stage0']['authorization_commit_sha'],
            'authorized_seal_sha256':state['b4_v2_stage0']['seal_sha256'],
            'contract_sha256':state['b4_v2_stage0']['contract_sha256'],
            'active_task_stage':state['active_task']['stage'],
            'stage1_executed':state['b4_v2_stage0']['stage1_executed'],
            'T1_T8_executed':state['b4_v2_stage0']['T1_T8_executed'],
            'lock_status':state['active_integrator']['status'],
            'archive_sha256':build['archive_sha256'],
            'archive_bytes':build['zip_bytes'],
            'archive_members':build['member_count'],
            'archive_headroom_bytes':100000000-build['zip_bytes'],
            'github_final_readback':'PASS',
            'handoff_verification':'PASS'
          }
          Path('CANONICAL_PERSISTENCE_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          files.append('CANONICAL_PERSISTENCE_SUMMARY.json')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as z:
            for f in files:
              p=Path(f); assert p.is_file(), f
              info=zipfile.ZipInfo(f,date_time=(1980,1,1,0,0,0)); info.create_system=0; info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
              z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
            assert z.testzip() is None
            assert len(z.namelist())==len(set(z.namelist()))
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('PERSISTENCE_SHA256.txt').write_text(f'{h}  {out.name}\n')
          print('persistence_sha256='+h)
          print('persistence_bytes='+str(out.stat().st_size))
          PY
      - name: Upload persistence ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CP20_TASK8B3_E7R_B4_V2_CANONICAL_INTAKE_STAGE1_AUTHORIZATION_PERSISTENCE
          path: |
            CP20_TASK8B3_E7R_B4_V2_CANONICAL_INTAKE_STAGE1_AUTHORIZATION_PERSISTENCE.zip
            PERSISTENCE_SHA256.txt
          if-no-files-found: error
          retention-days: 90
