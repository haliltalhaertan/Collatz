name: CP20 integration archive build

on:
  push:
    branches:
      - integration-build-e7r-b3-20260904

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair prepared integration hash manifest if needed
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          decision = Path('research_manager/decisions/CP20_TASK8B3_E7_RECOVERY_B3_AUDIT_INTEGRATION_2026-09-04.md')
          journal = Path('research_manager/RESEARCH_JOURNAL.jsonl')
          state_path = Path('CURRENT_RESEARCH_STATE.json')

          old = 'a02d580d4198d2094b60532b3dc500c29f15e3a20f6b8fd71264e2f1225efbba'
          decision_hash = hashlib.sha256(decision.read_bytes()).hexdigest()
          if decision_hash != '4a0435415330453ca919272734a8c5bfa27f11781f9c37d6b9401eb849b58990':
              raise SystemExit('unexpected decision byte hash: '+decision_hash)

          text = journal.read_text(encoding='utf-8')
          if old in text:
              text = text.replace(old, decision_hash)
              journal.write_text(text, encoding='utf-8', newline='\n')
          journal_hash = hashlib.sha256(journal.read_bytes()).hexdigest()

          state = json.loads(state_path.read_text(encoding='utf-8'))
          def replace_exact(obj, before, after):
              if isinstance(obj, dict):
                  return {k: replace_exact(v, before, after) for k, v in obj.items()}
              if isinstance(obj, list):
                  return [replace_exact(v, before, after) for v in obj]
              if obj == before:
                  return after
              return obj
          state = replace_exact(state, old, decision_hash)
          old_journal_hash = '2d70dc9c0bca19d14ef5f29986656c85332d6a5d5acf5f7d0c6479dd12d22b6f'
          state = replace_exact(state, old_journal_hash, journal_hash)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8', newline='\n')
          print('decision_sha256='+decision_hash)
          print('journal_sha256='+journal_hash)
          PY
          if ! git diff --quiet -- CURRENT_RESEARCH_STATE.json research_manager/RESEARCH_JOURNAL.jsonl; then
            git config user.name 'Halil Talha Ertan'
            git config user.email 'haliltalhaertan@mail.com'
            git add CURRENT_RESEARCH_STATE.json research_manager/RESEARCH_JOURNAL.jsonl
            git commit -m 'Repair E7R-B3 integration hash manifest'
            git push origin HEAD:integration-build-e7r-b3-20260904
          fi
      - name: Rebuild current archive
        run: |
          python tools/build_current_archive.py
          cp Collatz_Research_Archive_CURRENT.zip /tmp/archive-first.zip
          python tools/build_current_archive.py
          cmp /tmp/archive-first.zip Collatz_Research_Archive_CURRENT.zip
      - name: Integrity diagnostics
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          state = json.loads(Path('CURRENT_RESEARCH_STATE.json').read_text(encoding='utf-8'))
          def h(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          failures = 0
          for row in state['integrity']['repository_files']:
              actual = h(row['path'])
              if actual != row['sha256']:
                  failures += 1
                  print('REPO_MISMATCH', row['path'], 'expected='+row['sha256'], 'actual='+actual)
          with zipfile.ZipFile('Collatz_Research_Archive_CURRENT.zip') as zf:
              for row in state['integrity']['archive_members']:
                  try: actual = hashlib.sha256(zf.read(row['path'])).hexdigest()
                  except KeyError:
                      failures += 1
                      print('ARCHIVE_MISSING', row['path'])
                      continue
                  if actual != row['sha256']:
                      failures += 1
                      print('ARCHIVE_MISMATCH', row['path'], 'expected='+row['sha256'], 'actual='+actual)
          print('INTEGRITY_DIAGNOSTIC_FAILURES='+str(failures))
          if failures: raise SystemExit(1)
          PY
      - name: Verify handoff
        run: |
          git checkout -B main HEAD
          python tools/verify_handoff.py | tee HANDOFF_VERIFY_OUTPUT.txt
          grep -q 'HANDOFF VERIFICATION: PASS' HANDOFF_VERIFY_OUTPUT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e7r-b3-integration-build
          path: |
            Collatz_Research_Archive_CURRENT.zip
            CURRENT_ARCHIVE_BUILD.json
            HANDOFF_VERIFY_OUTPUT.txt
          if-no-files-found: error
          retention-days: 1
