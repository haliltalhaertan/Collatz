name: CP20 post-repair compile

on:
  push:
    branches:
      - cp20-publication-factor-pressure-v1-20260904

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp20-publication-factor-pressure-v1-20260904
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile manuscript
        working-directory: publication_cp20_factor_pressure
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error CP20_MANUSCRIPT.tex
          bibtex CP20_MANUSCRIPT
          pdflatex -interaction=nonstopmode -halt-on-error CP20_MANUSCRIPT.tex
          pdflatex -interaction=nonstopmode -halt-on-error CP20_MANUSCRIPT.tex
          if grep -E 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|multiply defined' CP20_MANUSCRIPT.log; then
            echo 'Unresolved reference/citation/label warning found.'
            exit 1
          fi
          echo '=== BOX WARNINGS ==='
          grep -E 'Overfull|Underfull' CP20_MANUSCRIPT.log || true
          pdfinfo CP20_MANUSCRIPT.pdf | grep '^Pages:' || true
      - name: Upload compiled PDF and log
        uses: actions/upload-artifact@v4
        with:
          name: cp20-postrepair-compile
          path: |
            publication_cp20_factor_pressure/CP20_MANUSCRIPT.pdf
            publication_cp20_factor_pressure/CP20_MANUSCRIPT.log
          retention-days: 7
