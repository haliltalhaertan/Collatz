name: Canonical Literature Transfer V1 Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Literature Transfer V1 Stage0 intake and Stage1 authorization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical prep commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen Stage0 and finalize canonical management state
        shell: bash
        env:
          STAGE0_SEAL: 403633178f22f703d83f8e7ffaddc9e416a0d733eaa203f7b7cf796d343b7c79
          STAGE0_MANIFEST: f486d82365ca77066b328660bf48cd891eacb8aeed7a439d8bfc67b87d5b9276
          LOCK_COMMIT: 11cde04e474899c42bf752d0e66dc7875d43af83
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import hashlib, json, os, zipfile

          repo = Path('.')
          result = repo / 'research_manager/results/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE0'
          seal_path = result / 'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_PRE_RUN_SEAL.zip'
          manifest_path = result / 'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_PRE_RUN_SHA256SUMS.txt'
          final_record_path = result / 'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE0_FINAL_RECORD.json'
          definitions_path = result / 'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_PROJECT_DEFINITIONS.md'
          helper_path = result / 'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_EXACT_SYMBOLIC_CHECKS.py'
          accept_path = repo / 'research_manager/decisions/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE0_ACCEPTANCE_2026-09-04.md'
          auth_path = repo / 'research_manager/decisions/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUTHORIZATION_2026-09-04.md'
          prompt_path = repo / 'research_manager/prompts/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_MANAGER_AUTHORIZATION_PROMPT_2026-09-04.md'
          journal_path = repo / 'research_manager/RESEARCH_JOURNAL.jsonl'
          state_path = repo / 'CURRENT_RESEARCH_STATE.json'

          def sha_file(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()
          def sha_bytes(data): return hashlib.sha256(data).hexdigest()

          expected_seal = os.environ['STAGE0_SEAL']
          expected_manifest = os.environ['STAGE0_MANIFEST']
          assert sha_file(seal_path) == expected_seal, 'Stage0 seal SHA mismatch'
          assert sha_file(manifest_path) == expected_manifest, 'Stage0 manifest SHA mismatch'
          with zipfile.ZipFile(seal_path) as zf:
              assert zf.testzip() is None, 'Stage0 seal ZIP CRC failure'
              assert len(zf.infolist()) == 18, f'Stage0 member count mismatch: {len(zf.infolist())}'
          final_record = json.loads(final_record_path.read_text(encoding='utf-8'))
          assert final_record['seal_zip_sha256'] == expected_seal
          assert final_record['manifest_sha256'] == expected_manifest
          assert final_record['manifest_verification'] == 'PASS'
          assert final_record['zip_crc'] == 'PASS'
          assert final_record['seal_member_count'] == 18
          assert final_record['stage1_executed'] is False
          assert final_record['mappings_adjudicated'] is False
          assert final_record['project_base_commit'] == 'b3eaaae80a64003f4ee06a43b65fbd3680b8e22b'

          expected_hashes = {
              result / 'sources/tao/tao_1909.03562v7.pdf': '62cf49d4d8e8e681c7a4738ebaf56f3dbb7b67de95f37ccbac6e428ef3fc394e',
              result / 'sources/tao/tao_1909.03562v7_source.tar': 'ba81acd6254838251f1ee585256a6f9f223cdc9c73bed0a3c4fd25782d0124ad',
              result / 'sources/si_zenodo/main.pdf': '0dfad7f22df91c14c36182d7557aee537a462ef0a2a548422c366d21e2bd06c8',
              result / 'sources/si_github/main.pdf': '0dfad7f22df91c14c36182d7557aee537a462ef0a2a548422c366d21e2bd06c8',
              result / 'sources/si_github/main.tex': 'c1ff1f11f442fed1b2f7a37be61fe0e3c0916719549018557446ca01e81e0811',
              definitions_path: '7a8cdb45e31ff03a337e8cf4378c5326af4f47f736dbc3925ee9e357f821e007',
              helper_path: '7114fe2c56004a344c05e56cac305e593077eac43aa09ac084a196d1378ad4e2',
          }
          for path, expected in expected_hashes.items():
              assert sha_file(path) == expected, f'Frozen source/hash mismatch: {path}'

          state = json.loads(state_path.read_text(encoding='utf-8'))
          lock = state['active_integrator']
          assert lock['status'] == 'HELD'
          assert lock['holder'] == 'canonical-integrator-literature-transfer-v1-20260904'
          assert lock['base_commit'] == 'b3eaaae80a64003f4ee06a43b65fbd3680b8e22b'
          assert expected_seal in lock['scope']

          raw_lines = journal_path.read_bytes().splitlines()
          assert len(raw_lines) == 11, f'unexpected journal length before finalize: {len(raw_lines)}'
          previous = sha_bytes(raw_lines[-1])
          now = datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds')
          acceptance_hash = sha_file(accept_path)
          auth_hash = sha_file(auth_path)
          prompt_hash = sha_file(prompt_path)

          row12 = {'active_stage':'STAGE_1_AUTHORIZED_NOT_EXECUTED','active_task':'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1','event':'LITERATURE_TRANSFER_V1_STAGE0_ACCEPTED','evidence':{'canonical_base':'b3eaaae80a64003f4ee06a43b65fbd3680b8e22b','working_branch':'cp20-e7r-literature-transfer-v1-stage0-20260904','stage0_commit':'8ff843722bc9a4901fe72a1594d0fca95ca358b7','seal_zip_sha256':expected_seal,'manifest_sha256':expected_manifest,'seal_member_count':18,'manifest_verification':'PASS','zip_crc':'PASS','stage1_executed':False,'mappings_adjudicated':False,'stage0_drive_readback':'PASS','stage0_github_branch_readback':'PASS','stage0_acceptance_decision_sha256':acceptance_hash,'integrator_lock_acquisition_commit':os.environ['LOCK_COMMIT']},'next_action':'Stage 0 is accepted. Stage 1 is authorized in the following journal event only under the accepted normalized seal; Stage 1 is not executed by this transaction.','previous_entry_sha256':previous,'schema':'COLLATZ_RESEARCH_JOURNAL_V1','sequence':12,'timestamp':now}
          line12 = json.dumps(row12, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode('utf-8')
          previous = sha_bytes(line12)
          exact_next = 'Execute Stage 1 once under seal ' + expected_seal + ', adjudicating M1–M8 in order and obeying the binding M3 repair and the LT-N6/LT-N7/LT-CT audit stop rule. Do not begin weighted-operator work or E8.'
          row13 = {'active_stage':'STAGE_1_AUTHORIZED_NOT_EXECUTED','active_task':'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1','event':'LITERATURE_TRANSFER_V1_STAGE1_MANAGER_AUTHORIZED','evidence':{'authorized_seal_zip_sha256':expected_seal,'authorization_decision_sha256':auth_hash,'authorization_prompt_sha256':prompt_hash,'m1_m8_required_order':True,'m3_helper_not_evidence':True,'m3_independent_exact_implementation_required':True,'si_theorems_unaudited':True,'audit_stop_rules':['LT-N6','LT-N7','LT-CT'],'stage1_executed':False,'weighted_operator_authorized':False,'e8_authorized':False},'next_action':exact_next,'previous_entry_sha256':previous,'schema':'COLLATZ_RESEARCH_JOURNAL_V1','sequence':13,'timestamp':now}
          line13 = json.dumps(row13, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode('utf-8')
          with journal_path.open('ab') as f: f.write(line12 + b'\n' + line13 + b'\n')

          lock['lock_acquisition_commit'] = os.environ['LOCK_COMMIT']; lock['status'] = 'RELEASED'
          state['active_task']['stage'] = 'STAGE_1_AUTHORIZED_NOT_EXECUTED'
          state['continuity']['minimum_required_commit'] = os.environ['GITHUB_SHA']
          state['documents']['accepted_checkpoint_decision'] = str(accept_path.relative_to(repo)).replace('\\','/')
          state['documents']['active_authorization_decision'] = str(auth_path.relative_to(repo)).replace('\\','/')
          state['documents']['active_authorization_prompt'] = str(prompt_path.relative_to(repo)).replace('\\','/')
          state['documents']['active_research_prompt'] = str(prompt_path.relative_to(repo)).replace('\\','/')
          state['literature_transfer_v1'] = {'stage0':{'status':'[LITERATURE TRANSFER V1 — STAGE 0 FROZEN]','acceptance':'[ACCEPT STAGE 0]','canonical_base':'b3eaaae80a64003f4ee06a43b65fbd3680b8e22b','working_branch':'cp20-e7r-literature-transfer-v1-stage0-20260904','working_branch_commit':'8ff843722bc9a4901fe72a1594d0fca95ca358b7','seal_zip_sha256':expected_seal,'manifest_sha256':expected_manifest,'seal_member_count':18,'manifest_verification':'PASS','zip_crc':'PASS','stage1_executed':False,'mappings_adjudicated':False,'drive_readback':'PASS','github_branch_readback':'PASS','frozen_sources':{'tao_arxiv':'1909.03562v7','tao_pdf_sha256':'62cf49d4d8e8e681c7a4738ebaf56f3dbb7b67de95f37ccbac6e428ef3fc394e','tao_source_archive_sha256':'ba81acd6254838251f1ee585256a6f9f223cdc9c73bed0a3c4fd25782d0124ad','si_zenodo_doi':'10.5281/zenodo.20027097','si_pdf_sha256':'0dfad7f22df91c14c36182d7557aee537a462ef0a2a548422c366d21e2bd06c8','si_github_commit':'119199e7165505f9535952e272056af912ce59fb','si_main_tex_sha256':'c1ff1f11f442fed1b2f7a37be61fe0e3c0916719549018557446ca01e81e0811'}},'stage1_authorization':{'status':'[LITERATURE TRANSFER V1 — STAGE 1 AUTHORIZED — NOT EXECUTED]','authorized_seal_zip_sha256':expected_seal,'objective':'Adjudicate M1–M8 by exact normal-form derivation from the frozen project, Tao v7, and Si 2026 sources.','required_order':['M1','M2','M3','M4','M5','M6','M7','M8'],'manager_repair':'candidate_m3_project_exponent() is not accepted exact project-phase evidence; negative exponent rows require an independent modular-inverse + dyadic-correction / unified-modulus implementation from PROJECT_DEFINITIONS.md, separately hashed.','si_theorem_status':'[LITERATURE CLAIM — UNAUDITED]','audit_stop':['LT-N6','LT-N7','LT-CT'],'stage1_executed':False,'weighted_operator_authorized':False,'e8_authorized':False}}
          state['next_action'] = {'authorized_stage':'STAGE_1_ONLY','executed_in_this_transaction':False,'instruction':exact_next,'prompt':str(prompt_path.relative_to(repo)).replace('\\','/'),'requires_user_or_external_result':False}
          state['returned_result'] = {'acceptance_status':'LITERATURE_TRANSFER_V1_STAGE0_ACCEPTED_STAGE1_AUTHORIZED_NOT_EXECUTED','stage0_seal_zip_sha256':expected_seal,'stage0_manifest_sha256':expected_manifest,'stage0_working_branch_commit':'8ff843722bc9a4901fe72a1594d0fca95ca358b7','stage1_executed':False}
          additions = ['Do not execute Stage 1 except once under the authorized Literature Transfer V1 seal SHA-256.','Do not use candidate_m3_project_exponent() as mathematical evidence for M3.','Do not use any unsealed Tao or Si source revision.','Do not promote a Si theorem to a project dependency without independent proof or separate zero-trust audit.','Do not rescue a failed Literature Transfer mapping with weighted operators, modified geometry, adaptive frequency search, adaptive endpoint search, new literature sources, or E8.']
          for x in additions:
              if x not in state['prohibited_inferences']: state['prohibited_inferences'].append(x)
          def upsert(rows,path,digest):
              for row in rows:
                  if row['path']==path: row['sha256']=digest; return
              rows.append({'path':path,'sha256':digest})
          repo_rows = state['integrity']['repository_files']
          repo_hash_targets = [accept_path,auth_path,prompt_path,journal_path,seal_path,manifest_path,final_record_path,definitions_path,helper_path,result/'sources/tao/tao_1909.03562v7.pdf',result/'sources/tao/tao_1909.03562v7_source.tar',result/'sources/si_zenodo/main.pdf',result/'sources/si_github/main.pdf',result/'sources/si_github/main.tex']
          for p in repo_hash_targets: upsert(repo_rows,str(p.relative_to(repo)).replace('\\','/'),sha_file(p))
          archive_rows = state['integrity']['archive_members']; prefix='Collatz Problemi — Araştırma Arşivi/RESEARCH_MANAGEMENT/'
          for p in [accept_path,auth_path,prompt_path,journal_path,seal_path,manifest_path,final_record_path,definitions_path,helper_path]:
              rel=str(p.relative_to(repo/'research_manager')).replace('\\','/'); upsert(archive_rows,prefix+rel,sha_file(p))
          state['updated_at']=now
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY

      - name: Rebuild deterministic current archive
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_current_archive.py

      - name: Create final canonical commit and verify
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Canonical Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/canonical-literature-transfer-v1-finalize.yml
          git add CURRENT_RESEARCH_STATE.json START_HERE_CURRENT_HANDOFF.md CURRENT_ARCHIVE_BUILD.json Collatz_Research_Archive_CURRENT.zip research_manager
          git commit -m 'Integrate Literature Transfer V1 Stage0 and authorize Stage1'
          python tools/verify_handoff.py | tee HANDOFF_VERIFICATION.txt
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "final_sha=${FINAL_SHA}" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          build=json.loads(Path('CURRENT_ARCHIVE_BUILD.json').read_text(encoding='utf-8'))
          manifest={'schema':'CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_CANONICAL_PERSISTENCE_V1','main_commit_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'archive_sha256':build['archive_sha256'],'archive_bytes':build['zip_bytes'],'archive_members':build['member_count'],'stage':'STAGE_1_AUTHORIZED_NOT_EXECUTED','authorized_seal_zip_sha256':'403633178f22f703d83f8e7ffaddc9e416a0d733eaa203f7b7cf796d343b7c79','handoff_verification':'PASS','stage1_executed':False}
          Path('PERSISTENCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git push origin HEAD:main

      - name: Upload canonical persistence bundle
        uses: actions/upload-artifact@v4
        with:
          name: CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_CANONICAL_PERSISTENCE
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            Collatz_Research_Archive_CURRENT.zip
            CURRENT_ARCHIVE_BUILD.json
            CURRENT_RESEARCH_STATE.json
            START_HERE_CURRENT_HANDOFF.md
            research_manager/RESEARCH_JOURNAL.jsonl
            research_manager/decisions/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE0_ACCEPTANCE_2026-09-04.md
            research_manager/decisions/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_AUTHORIZATION_2026-09-04.md
            research_manager/prompts/CP20_TASK8B3_E7R_LITERATURE_TRANSFER_V1_STAGE1_MANAGER_AUTHORIZATION_PROMPT_2026-09-04.md
            HANDOFF_VERIFICATION.txt
            PERSISTENCE_MANIFEST.json
